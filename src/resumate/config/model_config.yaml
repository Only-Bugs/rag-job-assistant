llm:
  model_name: qwen2.5:1.5b
  host: http://localhost:11434
  temperature: 0.15
  parallel_workers: 4
  max_tokens:
    skills: 600
    cover: 600
    emails: 750
    ats: 250
  tasks:
    cover:
      temperature: 0.4
      top_p: 0.9
      repeat_penalty: 1.1
      num_predict: 450
    emails:
      temperature: 0.4
      top_p: 0.9
      repeat_penalty: 1.1
      num_predict: 750
    skills:
      temperature: 0.2
      top_p: 0.9
      repeat_penalty: 1.1
      num_predict: 600
    ats:
      temperature: 0.2
      top_p: 0.9
      repeat_penalty: 1.1
      num_predict: 250
    resume_parse:
      temperature: 0.0
      num_predict: 1024
runtime:
  context_limits:
    jd_chars: 2000
    retrieved_jd_chars: 1500
    retrieved_profile_chars: 1200
embeddings:
  model_name: all-MiniLM-L6-v2
